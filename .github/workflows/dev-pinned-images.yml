name: Dev-Pinned Images

on:
  pull_request:
    branches: [dev-pinned]
  push:
    branches: [dev-pinned]

env:
  REGISTRY_NAMESPACE: docker.io/rj9317

jobs:
  build:
    name: ${{ matrix.component.name }} (${{ matrix.platform }})
    if: github.repository == 'randalljohnson/threeport'
    environment: development
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
        component:
          - { name: rest-api,                      main: cmd/rest-api/main_gen.go }
          - { name: database-migrator,             main: cmd/database-migrator/main_gen.go }
          - { name: agent,                         main: cmd/agent/main.go }
          - { name: workload-controller,           main: cmd/workload-controller/main_gen.go }
          - { name: kubernetes-runtime-controller, main: cmd/kubernetes-runtime-controller/main_gen.go }
          - { name: aws-controller,                main: cmd/aws-controller/main_gen.go }
          - { name: gcp-controller,                main: cmd/gcp-controller/main_gen.go }
          - { name: oci-controller,                main: cmd/oci-controller/main_gen.go }
          - { name: gateway-controller,            main: cmd/gateway-controller/main_gen.go }
          - { name: control-plane-controller,      main: cmd/control-plane-controller/main_gen.go }
          - { name: helm-workload-controller,      main: cmd/helm-workload-controller/main_gen.go }
          - { name: terraform-controller,          main: cmd/terraform-controller/main_gen.go }
          - { name: observability-controller,      main: cmd/observability-controller/main_gen.go }
          - { name: secret-controller,             main: cmd/secret-controller/main_gen.go }
          - { name: machine-runtime-controller,    main: cmd/machine-runtime-controller/main_gen.go }
          - { name: machine-workload-controller,   main: cmd/machine-workload-controller/main_gen.go }
    steps:
    - uses: actions/checkout@v4

    - uses: docker/setup-buildx-action@v3

    - uses: docker/login-action@v3
      with:
        registry: docker.io
        username: rj9317
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Prepare platform tag
      id: platform
      run: echo "tag=$(echo '${{ matrix.platform }}' | tr / -)" >> "$GITHUB_OUTPUT"

    - name: Build and push by digest
      id: build
      uses: docker/build-push-action@v5
      with:
        context: .
        file: Dockerfile
        target: release
        platforms: ${{ matrix.platform }}
        build-args: |
          MAIN=${{ matrix.component.main }}
        cache-from: type=gha,scope=dev-pinned-${{ matrix.component.name }}-${{ steps.platform.outputs.tag }}
        cache-to: type=gha,scope=dev-pinned-${{ matrix.component.name }}-${{ steps.platform.outputs.tag }},mode=max
        outputs: type=image,name=${{ env.REGISTRY_NAMESPACE }}/threeport-${{ matrix.component.name }},push-by-digest=true,name-canonical=true,push=true

    - name: Export digest
      run: |
        mkdir -p /tmp/digests/${{ matrix.component.name }}
        digest='${{ steps.build.outputs.digest }}'
        echo "${digest#sha256:}" > /tmp/digests/${{ matrix.component.name }}/${{ steps.platform.outputs.tag }}

    - uses: actions/upload-artifact@v4
      with:
        name: digests-${{ matrix.component.name }}-${{ steps.platform.outputs.tag }}
        path: /tmp/digests/${{ matrix.component.name }}/*
        retention-days: 1

  merge:
    name: manifest (${{ matrix.name }})
    if: github.repository == 'randalljohnson/threeport'
    environment: development
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        name:
          - rest-api
          - database-migrator
          - agent
          - workload-controller
          - kubernetes-runtime-controller
          - aws-controller
          - gcp-controller
          - oci-controller
          - gateway-controller
          - control-plane-controller
          - helm-workload-controller
          - terraform-controller
          - observability-controller
          - secret-controller
          - machine-runtime-controller
          - machine-workload-controller
    steps:
    - uses: actions/download-artifact@v4
      with:
        pattern: digests-${{ matrix.name }}-*
        path: /tmp/digests
        merge-multiple: true

    - uses: docker/setup-buildx-action@v3

    - uses: docker/login-action@v3
      with:
        registry: docker.io
        username: rj9317
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Determine tags
      id: tags
      run: |
        {
          echo "list<<EOF"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "${{ env.REGISTRY_NAMESPACE }}/threeport-${{ matrix.name }}:dev-pinned-pr-${{ github.event.pull_request.number }}"
          else
            echo "${{ env.REGISTRY_NAMESPACE }}/threeport-${{ matrix.name }}:dev-pinned"
            echo "${{ env.REGISTRY_NAMESPACE }}/threeport-${{ matrix.name }}:dev-pinned-${{ github.sha }}"
          fi
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Create manifest list
      run: |
        cd /tmp/digests
        digests=()
        for f in *; do
          digests+=("${{ env.REGISTRY_NAMESPACE }}/threeport-${{ matrix.name }}@sha256:$(cat "$f")")
        done
        tags=()
        while IFS= read -r tag; do
          [[ -n "$tag" ]] && tags+=("--tag" "$tag")
        done <<< '${{ steps.tags.outputs.list }}'
        docker buildx imagetools create "${tags[@]}" "${digests[@]}"
