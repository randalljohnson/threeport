# Reusable: runs `goreleaser release --clean` against the upstream
# .goreleaser.yml. Callers either rely on the natural tag context
# (release.yml on tag push) or pass a synthesized tag via `ref`.

name: GoReleaser

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to checkout (tag, branch, or sha). Empty defaults to the caller's event ref.
        type: string
        required: false
        default: ''

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        # goreleaser needs full history to generate the changelog
        fetch-depth: 0
        ref: ${{ inputs.ref }}

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'

    - name: Run GoReleaser
      uses: goreleaser/goreleaser-action@v5.0.0
      with:
        version: v1.26.2
        # serialize the per-target builds; the default is one per cpu, and
        # several concurrent threeport compiles exhaust the runner's memory
        # and drop it from the server. the trimmed platform set keeps the
        # serial build inside goreleaser's default timeout.
        args: release --clean --parallelism 1 -f ./.goreleaser.yml
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
