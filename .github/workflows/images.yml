# Per-component matrix. Each cell does its own compile + multi-arch
# buildx push for one component via `mage build:<X>Image`. All cells
# share the actions/cache key (Go cache is content-addressed, deps
# overlap across components). Buildx layer cache is per-component.

name: Images

on:
  pull_request:
    branches: [dev-pinned]
  push:
    branches: [dev-pinned]

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: ${{ matrix.component.name }}
    if: github.repository == 'randalljohnson/threeport'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        component:
          - { name: rest-api,                      mage: build:apiImage }
          - { name: database-migrator,             mage: build:dbMigratorImage }
          - { name: agent,                         mage: build:agentImage }
          - { name: workload-controller,           mage: build:workloadControllerImage }
          - { name: kubernetes-runtime-controller, mage: build:kubernetesRuntimeControllerImage }
          - { name: aws-controller,                mage: build:awsControllerImage }
          - { name: gcp-controller,                mage: build:gcpControllerImage }
          - { name: oci-controller,                mage: build:ociControllerImage }
          - { name: gateway-controller,            mage: build:gatewayControllerImage }
          - { name: control-plane-controller,      mage: build:controlPlaneControllerImage }
          - { name: helm-workload-controller,      mage: build:helmWorkloadControllerImage }
          - { name: terraform-controller,          mage: build:terraformControllerImage }
          - { name: observability-controller,      mage: build:observabilityControllerImage }
          - { name: secret-controller,             mage: build:secretControllerImage }
          - { name: machine-runtime-controller,    mage: build:machineRuntimeControllerImage }
          - { name: machine-workload-controller,   mage: build:machineWorkloadControllerImage }
    env:
      GOPATH: /home/runner/go
    steps:
    - name: Checkout
      uses: actions/checkout@v6.0.2

    - name: Set up Go
      uses: actions/setup-go@v6.4.0
      with:
        go-version: '1.24'
        cache: false

    # Shared key across all matrix cells: Go's build cache is
    # content-addressed and components overlap heavily on dependencies,
    # so one cache holds the union and every cell restores the same blob.
    - name: Cache Go build + module cache
      uses: actions/cache@v5.0.5
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: go-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          go-${{ runner.os }}-

    - name: Install mage
      run: go install github.com/magefile/mage@v1.17.2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4.1.0

    - name: Log in to ghcr.io
      uses: docker/login-action@v4.2.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # For pull_request events, github.sha points at GHA's ephemeral
    # merge commit, which doesn't exist on the source branch. Prefer
    # github.event.pull_request.head.sha so the tag matches what
    # `git rev-parse --short=7 HEAD` returns on the developer's worktree.
    # For push events (merge to dev-pinned) the head.sha context is
    # unset, so fall back to github.sha.
    - name: Compute short SHA
      id: sha
      env:
        SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      run: echo "short=${SHA:0:7}" >> "$GITHUB_OUTPUT"

    - name: Determine tag
      id: tag
      run: |
        if [[ "${{ github.event_name }}" == "pull_request" ]]; then
          echo "value=dev-pinned-pr-${{ steps.sha.outputs.short }}" >> "$GITHUB_OUTPUT"
        else
          echo "value=dev-pinned-${{ steps.sha.outputs.short }}" >> "$GITHUB_OUTPUT"
        fi

    # GOMEMLIMIT caps each go build's heap. Two arches compile in
    # parallel; 2 x 5 GiB = 10 GiB + ~4 GiB runner overhead leaves
    # headroom on the 16 GiB runner. Heavy-SDK components (aws, oci)
    # OOMed at 6 GiB. Buildx layer cache is per-component since the
    # binary differs per image; the Go compile cache is the shared
    # actions/cache above.
    - name: Build and push
      env:
        GOMEMLIMIT: 5GiB
        BUILDX_CACHE_FROM: type=gha,scope=dev-${{ matrix.component.name }}
        BUILDX_CACHE_TO: type=gha,scope=dev-${{ matrix.component.name }},mode=max
      run: mage ${{ matrix.component.mage }} ghcr.io/randalljohnson ${{ steps.tag.outputs.value }} amd64,arm64
