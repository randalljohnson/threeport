# Reusable per-arch image build + push workflow.
#
# Two phases:
#
#   1. `build` runs one matrix cell per architecture (amd64, arm64) in
#      parallel. Each cell runs `mage build:allImages` once, which
#      iterates every controller internally and pushes single-arch tags
#      as <repo>/<image>:<tag>-<arch>. One runner per arch keeps the Go
#      build/module cache hot across every component build within that
#      cell.
#   2. `manifest` runs after both build cells succeed. It runs
#      `mage package:allManifests` once, which iterates every controller
#      and stitches its per-arch tags into a multi-arch manifest list
#      published as <repo>/<image>:<tag> via `docker buildx imagetools
#      create`. imagetools create only updates the manifest in the
#      registry; no blobs are re-uploaded.
#
# Component list is owned by mage (`Build.AllImages` /
# `Package.AllManifests`), so this workflow doesn't need to maintain it.
#
# Caches:
#   - actions/cache holds ~/.cache/go-build + ~/go/pkg/mod and is keyed
#     by go.sum. Shared across all component builds within an arch cell;
#     the first component primes the rest.
#   - buildx layer caching isn't used. The Dockerfile is base + binary
#     COPY; the binary changes every build and the BUILD_CREATED label
#     invalidates everything below it, so layer cache hits are limited
#     to the distroless base which is a sub-second registry pull.

name: Build Images

on:
  workflow_call:
    inputs:
      tag:
        description: Image tag to push (e.g. v0.7.0).
        type: string
        required: true
      image_repo:
        description: Image repo prefix (e.g. ghcr.io/threeport).
        type: string
        required: true
      arches:
        description: Comma-separated arch list (e.g. amd64,arm64 or amd64).
        type: string
        required: false
        default: 'amd64,arm64'
    secrets:
      GH_ACCESS_TOKEN:
        description: "Token for ghcr.io login. Caller passes via `secrets: inherit`."
        required: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: build-${{ matrix.arch }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    env:
      GOPATH: /home/runner/go
    steps:
    - name: Checkout
      uses: actions/checkout@v6.0.3

    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
        sudo docker image prune -af || true
        df -h

    - name: Set up Go
      uses: actions/setup-go@v6.4.0
      with:
        go-version: '1.26'
        cache: false

    # Restore the Go build + module cache; the matching save runs at job end
    # (even on failure) so a cold or failed build still banks compiled objects.
    # The run-id suffix makes each run save a fresh entry that the next run's
    # restore-keys prefix picks up, so the cache accretes toward warm.
    - name: Restore Go build + module cache
      uses: actions/cache/restore@v5.0.5
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        # save key: unique per run, so the end-of-job save always writes a fresh
        # entry (Actions caches are immutable; a fixed key would never update).
        key: go-${{ runner.os }}-${{ github.run_id }}
        # restore fallback: the run-id key above never matches a prior run, so
        # restore prefix-matches this, the newest cache for this OS. the key
        # deliberately carries neither go.sum nor the Go version: Go's build
        # cache already keys every action on the compiler version and its
        # inputs, so it reuses only what is still valid and recompiles the rest.
        # letting Go own invalidation avoids a stale token we must remember to bump.
        restore-keys: |
          go-${{ runner.os }}-

    # Derive -p from the runner's RAM so the same step auto-sizes: -p=1 on a
    # 7 GB runner, -p=4 on a 16 GB one, with no per-runner hardcoding.
    - name: Derive go build parallelism from runner memory
      run: |
        mem_kb=$(awk '/MemAvailable/ {print $2}' /proc/meminfo)    # usable RAM, in kB
        by_mem=$(( mem_kb / (1024 * 1024 * 7 / 2) ))               # one worker per ~3.5 GB
        cpus=$(nproc)                                              # but never exceed the CPU count
        p=$(( by_mem < 1 ? 1 : (by_mem > cpus ? cpus : by_mem) ))  # clamp to [1, cpus]
        echo "GOFLAGS=-p=$p" >> "$GITHUB_ENV"                      # later go/mage/test steps inherit it

    - name: Install mage
      run: go install github.com/magefile/mage@v1.17.2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4.1.0

    - name: Log in to ghcr.io
      uses: docker/login-action@v4.2.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GH_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}

    # build:allImages with a single arch pushes single-arch tags only;
    # the manifest job below stitches them via package:allManifests.
    # We split by arch because amd64 and arm64 don't share buildx or Go
    # build cache, so running them on separate runners is a free
    # parallelization win.
    - name: Build and push all components for ${{ matrix.arch }}
      env:
        # PARALLEL_IMAGE_BUILD controls how many image-package (buildx)
        # tasks run concurrently after binaries are pre-compiled.
        PARALLEL_IMAGE_BUILD: "4"
        # build:allImages reads repo, tag, and arch from these env vars.
        IMAGE_REPO: ${{ inputs.image_repo }}
        IMAGE_TAG: ${{ inputs.tag }}-${{ matrix.arch }}
        ARCH: ${{ matrix.arch }}
        # OCI image label values. BuildImage reads these and stamps them
        # onto the release stage via Dockerfile ARG/LABEL.
        GIT_REVISION: ${{ github.sha }}
        GIT_TAG: ${{ inputs.tag }}
      run: |
        export BUILD_CREATED="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        mage build:allImages

    # Save the Go cache even on failure so partial compile progress persists.
    - name: Save Go build + module cache
      if: always()  # run even when a prior step failed; default would skip it
      uses: actions/cache/save@v5.0.5
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: go-${{ runner.os }}-${{ github.run_id }}

  manifest:
    name: manifest
    needs: build
    runs-on: ubuntu-24.04
    env:
      GOPATH: /home/runner/go
    steps:
    - name: Checkout
      uses: actions/checkout@v6.0.3

    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
        sudo docker image prune -af || true
        df -h

    - name: Set up Go
      uses: actions/setup-go@v6.4.0
      with:
        go-version: '1.26'
        cache: false

    # Restore the warm Go cache the build jobs saved earlier in this run (this
    # job needs: build), so mage compiles the magefile fast instead of
    # cold-downloading and recompiling the threeport build dependencies.
    - name: Restore Go build + module cache
      uses: actions/cache/restore@v5.0.5
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: go-${{ runner.os }}-${{ github.run_id }}
        restore-keys: |
          go-${{ runner.os }}-

    - name: Install mage
      run: go install github.com/magefile/mage@v1.17.2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4.1.0

    - name: Log in to ghcr.io
      uses: docker/login-action@v4.2.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GH_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}

    - name: Create multi-arch manifests
      env:
        # imagetools create is light (manifest-only, no blob upload), so
        # we can fan out wider than the build phase.
        PARALLEL_IMAGE_BUILD: "8"
        # package:allManifests reads repo, tag, and arches from these env vars.
        IMAGE_REPO: ${{ inputs.image_repo }}
        IMAGE_TAG: ${{ inputs.tag }}
        ARCH: ${{ inputs.arches }}
      run: |
        mage package:allManifests
