# Native go build + thin Docker layer.
#
# Compilation happens via `mage build:allImages` on the runner, NOT
# inside a Dockerfile RUN. Go's content-addressed build cache
# (~/.cache/go-build, restored by actions/cache below) invalidates per
# package, so a single-file edit only recompiles that package. Inside a
# Dockerfile, the same edit invalidates the whole COPY layer and forces
# a cold rebuild. actions/cache is the only cache layer; buildx layer
# caching adds no value on top because the binary COPY changes every
# build.

name: Test

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
  # dev-only: run the full unit + integration suite on every push to the
  # dev integration branch.
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-24.04
    env:
      GOPATH: /home/runner/go
    steps:
    - name: Checkout
      uses: actions/checkout@v6.0.3

    - name: Set up Go
      uses: actions/setup-go@v6.4.0
      with:
        go-version: '1.26'
        cache: false

    # Primary cache for the workflow. Restoring Go's build + module cache
    # is what makes warm runs fast; the Docker layer cache further down
    # (integration-tests job) only covers the cheap COPY+alpine tail.
    # Restore the Go build + module cache; the matching save runs at job end
    # (even on failure) so a cold or failed build still banks compiled objects.
    # The run-id suffix makes each run save a fresh entry that the next run's
    # restore-keys prefix picks up, so the cache accretes toward warm.
    - name: Restore Go build + module cache
      uses: actions/cache/restore@v5.0.5
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        # save key: unique per run, so the end-of-job save always writes a fresh
        # entry (Actions caches are immutable; a fixed key would never update).
        key: go-${{ runner.os }}-${{ hashFiles('**/go.sum') }}-${{ github.run_id }}
        # restore fallback: the run-id key above never matches a prior run, so
        # restore prefix-matches these, newest cache for this go.sum first, then
        # any for this OS. this prefix match is where the cache hit happens.
        restore-keys: |
          go-${{ runner.os }}-${{ hashFiles('**/go.sum') }}-
          go-${{ runner.os }}-

    # Derive -p from the runner's RAM so the same step auto-sizes: -p=1 on a
    # 7 GB runner, -p=4 on a 16 GB one, with no per-runner hardcoding.
    - name: Derive go build parallelism from runner memory
      run: |
        mem_kb=$(awk '/MemAvailable/ {print $2}' /proc/meminfo)    # usable RAM, in kB
        by_mem=$(( mem_kb / (1024 * 1024 * 7 / 2) ))               # one worker per ~3.5 GB
        cpus=$(nproc)                                              # but never exceed the CPU count
        p=$(( by_mem < 1 ? 1 : (by_mem > cpus ? cpus : by_mem) ))  # clamp to [1, cpus]
        echo "GOFLAGS=-p=$p" >> "$GITHUB_ENV"                      # later go/mage/test steps inherit it

    - name: Install mage
      run: go install github.com/magefile/mage@v1.17.2

    - name: Install threeport-sdk
      run: mage install:sdk

    - name: Run threeport-sdk
      run: ${{ env.GOPATH }}/bin/threeport-sdk gen --config sdk-config.yaml

    - name: Verify codegen is idempotent
      run: git diff --exit-code

    - name: Unit tests
      run: go test -count=1 ./pkg/... ./internal/... ./cmd/...

    # Save the Go cache even on failure so partial compile progress persists.
    - name: Save Go build + module cache
      if: always()  # run even when a prior step failed; default would skip it
      uses: actions/cache/save@v5.0.5
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: go-${{ runner.os }}-${{ hashFiles('**/go.sum') }}-${{ github.run_id }}

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-24.04
    env:
      GOPATH: /home/runner/go
    steps:
    - name: Checkout
      uses: actions/checkout@v6.0.3

    - name: Set up Go
      uses: actions/setup-go@v6.4.0
      with:
        go-version: '1.26'
        cache: false

    # Primary cache for the workflow. Restoring Go's build + module cache
    # is what makes warm runs fast; the Docker layer cache further down
    # (integration-tests job) only covers the cheap COPY+alpine tail.
    # Restore the Go build + module cache; the matching save runs at job end
    # (even on failure) so a cold or failed build still banks compiled objects.
    # The run-id suffix makes each run save a fresh entry that the next run's
    # restore-keys prefix picks up, so the cache accretes toward warm.
    - name: Restore Go build + module cache
      uses: actions/cache/restore@v5.0.5
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        # save key: unique per run, so the end-of-job save always writes a fresh
        # entry (Actions caches are immutable; a fixed key would never update).
        key: go-${{ runner.os }}-${{ hashFiles('**/go.sum') }}-${{ github.run_id }}
        # restore fallback: the run-id key above never matches a prior run, so
        # restore prefix-matches these, newest cache for this go.sum first, then
        # any for this OS. this prefix match is where the cache hit happens.
        restore-keys: |
          go-${{ runner.os }}-${{ hashFiles('**/go.sum') }}-
          go-${{ runner.os }}-

    # Derive -p from the runner's RAM so the same step auto-sizes: -p=1 on a
    # 7 GB runner, -p=4 on a 16 GB one, with no per-runner hardcoding.
    - name: Derive go build parallelism from runner memory
      run: |
        mem_kb=$(awk '/MemAvailable/ {print $2}' /proc/meminfo)    # usable RAM, in kB
        by_mem=$(( mem_kb / (1024 * 1024 * 7 / 2) ))               # one worker per ~3.5 GB
        cpus=$(nproc)                                              # but never exceed the CPU count
        p=$(( by_mem < 1 ? 1 : (by_mem > cpus ? cpus : by_mem) ))  # clamp to [1, cpus]
        echo "GOFLAGS=-p=$p" >> "$GITHUB_ENV"                      # later go/mage/test steps inherit it

    - name: Install mage
      run: go install github.com/magefile/mage@v1.17.2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4.1.0
      with:
        # share host network so buildx reaches the local registry in the
        # next step.
        driver-opts: network=host

    - name: Create local container registry
      run: mage dev:localRegistryUp

    # Native compile via mage (uses the warm Go cache restored above),
    # then PARALLEL_IMAGE_BUILD workers package images.
    - name: Build and push control plane component images
      env:
        PARALLEL_IMAGE_BUILD: "4"
      run: mage build:allImages

    - name: Build tptctl
      run: mage build:tptctl

    - name: Create test control plane
      run: mage test:up

    - name: Integration tests
      run: mage test:integration

    # Save the Go cache even on failure so partial compile progress persists.
    - name: Save Go build + module cache
      if: always()  # run even when a prior step failed; default would skip it
      uses: actions/cache/save@v5.0.5
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: go-${{ runner.os }}-${{ hashFiles('**/go.sum') }}-${{ github.run_id }}
