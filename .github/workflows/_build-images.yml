# Reusable per-component image build + push workflow. Each matrix
# cell does its own compile + multi-arch buildx push for one component
# via `mage build:<X>Image`. All cells share the actions/cache key
# (Go cache is content-addressed, deps overlap across components).
# Buildx layer cache is per-component since the binary differs per image.

name: Build Images

on:
  workflow_call:
    inputs:
      tag:
        description: Image tag to push (e.g. v0.7.0).
        type: string
        required: true
      image_repo:
        description: Image repo prefix (e.g. ghcr.io/threeport).
        type: string
        required: true
      arches:
        description: Comma-separated arch list for buildx (e.g. amd64,arm64 or amd64).
        type: string
        required: false
        default: 'amd64,arm64'
    secrets:
      GH_ACCESS_TOKEN:
        description: "Token for ghcr.io login. Caller passes via `secrets: inherit`."
        required: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: ${{ matrix.component.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        component:
          - { name: rest-api,                       mage: build:apiImage }
          - { name: database-migrator,              mage: build:dbMigratorImage }
          - { name: agent,                          mage: build:agentImage }
          - { name: kubernetes-workload-controller, mage: build:kubernetesWorkloadControllerImage }
          - { name: kubernetes-runtime-controller,  mage: build:kubernetesRuntimeControllerImage }
          - { name: aws-controller,                 mage: build:awsControllerImage }
          - { name: gcp-controller,                 mage: build:gcpControllerImage }
          - { name: oci-controller,                 mage: build:ociControllerImage }
          - { name: gateway-controller,             mage: build:gatewayControllerImage }
          - { name: control-plane-controller,       mage: build:controlPlaneControllerImage }
          - { name: helm-workload-controller,       mage: build:helmWorkloadControllerImage }
          - { name: terraform-controller,           mage: build:terraformControllerImage }
          - { name: observability-controller,       mage: build:observabilityControllerImage }
          - { name: secret-controller,              mage: build:secretControllerImage }
          - { name: machine-runtime-controller,     mage: build:machineRuntimeControllerImage }
          - { name: machine-workload-controller,    mage: build:machineWorkloadControllerImage }
    env:
      GOPATH: /home/runner/go
    steps:
    - name: Checkout
      uses: actions/checkout@v6.0.2

    - name: Set up Go
      uses: actions/setup-go@v6.4.0
      with:
        go-version: '1.24'
        cache: false

    # Shared key across all matrix cells: Go's build cache is
    # content-addressed and components overlap heavily on dependencies,
    # so one cache holds the union and every cell restores the same blob.
    - name: Cache Go build + module cache
      uses: actions/cache@v5.0.5
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: go-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          go-${{ runner.os }}-

    - name: Install mage
      run: go install github.com/magefile/mage@v1.17.2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4.1.0

    - name: Log in to ghcr.io
      uses: docker/login-action@v4.2.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GH_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}

    # GO_BUILD_PARALLELISM caps concurrent compile workers per `go build`
    # invocation. 2 archs in parallel x 2 workers each = 4 concurrent
    # compile workers, matched to the runner's 4 vCPU. Buildx layer cache
    # is per-component since the binary differs per image; the Go compile
    # cache is the shared actions/cache above.
    - name: Build and push
      env:
        GO_BUILD_PARALLELISM: "2"
        BUILDX_CACHE_FROM: type=gha,scope=${{ matrix.component.name }}
        BUILDX_CACHE_TO: type=gha,scope=${{ matrix.component.name }},mode=max
        # OCI image label values. BuildImage reads these and stamps
        # them onto the release stage via Dockerfile ARG/LABEL.
        GIT_REVISION: ${{ github.sha }}
        GIT_TAG: ${{ inputs.tag }}
      run: |
        export BUILD_CREATED="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        mage ${{ matrix.component.mage }} ${{ inputs.image_repo }} ${{ inputs.tag }} ${{ inputs.arches }}
