# Native go build + thin Docker layer.
#
# Compilation happens via `mage build:allImages` on the runner, NOT
# inside a Dockerfile RUN. Go's content-addressed build cache
# (~/.cache/go-build, restored by actions/cache below) invalidates per
# package, so a single-file edit only recompiles that package. Inside a
# Dockerfile, the same edit invalidates the whole COPY layer and forces
# a cold rebuild. actions/cache is the only cache layer; buildx layer
# caching adds no value on top because the binary COPY changes every
# build.

name: Test

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-24.04' }}
    steps:
    - name: Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Go setup
      uses: ./.github/actions/go-setup

    - name: Install threeport-sdk
      run: mage install:sdk

    - name: Run threeport-sdk
      run: threeport-sdk gen --config sdk-config.yaml

    - name: Verify codegen is idempotent
      run: git diff --exit-code

    - name: Unit tests
      run: mage test:unit

  # Generates a module with the SDK, then builds and vets the output.
  module-generation:
    name: Module Generation
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-24.04' }}
    steps:
    - name: Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Go setup
      uses: ./.github/actions/go-setup

    - name: Generate and build the module fixture
      run: mage test:moduleGen

  # Runs the tests that need a real CockroachDB. The suite starts the container
  # itself, so this needs docker and not a control plane, which is why it is its
  # own job rather than a step in the integration tests.
  cockroach-tests:
    name: CockroachDB Tests
    runs-on: ubuntu-24.04
    env:
      GOPATH: /home/runner/go
    steps:
    - name: Checkout
      uses: actions/checkout@v6.0.3

    - name: Set up Go
      uses: actions/setup-go@v6.4.0
      with:
        go-version: '1.26'
        cache: false

    - name: Cache Go build + module cache
      uses: actions/cache@v5.0.5
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: go-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          go-${{ runner.os }}-

    - name: Install mage
      run: go install github.com/magefile/mage@v1.17.2

    - name: CockroachDB tests
      run: mage test:cockroach

  integration-tests:
    name: Integration Tests
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-24.04' }}
    env:
      # target the local registry for both the image build and the install
      # step; mage self-derives the base tag (no per-arch suffix), so build and
      # install resolve the same localhost:5001/<image>:<tag>.
      IMAGE_REPO: localhost:5001
    steps:
    - name: Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Go setup
      uses: ./.github/actions/go-setup

    - name: Docker setup
      uses: ./.github/actions/docker-setup
      with:
        # share host network so buildx reaches the local registry started in
        # the next step.
        driver-opts: network=host

    - name: Create local container registry
      run: mage dev:localRegistryUp

    # Native compile via mage (uses the warm Go cache restored by the composite),
    # then PARALLEL_IMAGE_BUILD workers package images.
    - name: Build and push control plane component images
      run: mage build:allImages

    - name: Build tptctl
      run: mage build:tptctl

    - name: Create test control plane
      run: mage test:up

    - name: Integration tests
      run: mage test:integration

    # Runs after the integration tests because it installs into the same
    # control plane, so a failure here is the module install and nothing else.
    - name: Generate, build and install a module
      run: mage test:moduleInstall

    # Always run: tear down the kind cluster + tptctl state + local registry
    # so a failed run doesn't leave orphaned containers/networks in the
    # shared /opt/dind-storage hostPath that would trip the next run on the
    # same node with a "node(s) already exist for a cluster" error.
    - name: Teardown
      if: always()
      run: mage ci:teardown
