# Shared buildx + ghcr login preamble for CI jobs that push images.

name: Docker login
description: Set up Buildx and log in to ghcr.io.

inputs:
  token:
    description: GITHUB_TOKEN used to authenticate the ghcr.io login.
    required: true

runs:
  using: composite
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

    - name: Log in to ghcr.io
      uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.token }}
