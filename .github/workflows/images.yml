# Builds and publishes threeport's component images as multi-arch manifest
# lists to ghcr.io under the repo's own owner, so a fork publishes to its
# own namespace with no edits.
#
# Triggers on version tag push only (v*). Cutting a release via
# `mage release:dev | rc | ga` synthesizes the tag and pushes it, which
# fires both this workflow (component images) and release.yml (the
# tptctl + threeport-sdk binaries). Dev commits don't build images on
# their own — that's deliberate: per-commit image builds were redundant
# with the per-tag build, and untagged snapshot images had nobody pinning
# them. Use `mage release:dev` to mint a snapshot when you need it.
#
# Two phases: the build matrix runs one cell per arch (amd64, arm64),
# pushing single-arch tags <image>:<tag>-<arch> per cell (each cell derives
# the -<arch> suffix from ARCH); the manifest job stitches them into the
# bare <image>:<tag> manifest list via mage package:allManifests. mage
# self-derives the repo and base tag from the CI context, so this workflow
# passes no positional args. The component list is owned by mage, so this
# workflow does not maintain it.

name: Images

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: build-${{ matrix.arch }}
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
    - name: Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Go setup
      uses: ./.github/actions/go-setup
      with:
        # cache per arch so the amd64 and arm64 cells don't overwrite one
        # shared Go build cache entry
        cache-arch: ${{ matrix.arch }}

    - name: Docker login
      uses: ./.github/actions/docker-login
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    # build:allImages with a single arch pushes single-arch tags only; the
    # manifest job below stitches them via package:allManifests. amd64 and
    # arm64 don't share buildx or Go build cache, so separate runners are a
    # free parallelization win. mage self-derives the repo (ghcr.io/<owner>)
    # and base tag (the git tag on a tag build, else v<version>.<sha>) from
    # the CI context; the per-arch -<arch> push suffix is derived from ARCH.
    - name: Build and push all components for ${{ matrix.arch }}
      env:
        ARCH: ${{ matrix.arch }}
      run: mage build:allImages

  manifest:
    name: manifest
    needs: build
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-24.04' }}
    steps:
    - name: Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Go setup
      uses: ./.github/actions/go-setup

    - name: Docker login
      uses: ./.github/actions/docker-login
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    # mage self-derives the same repo and base tag the build job used, so the
    # manifest list stitches the single-arch tags under the canonical bare tag.
    # package:allManifests discovers the per-arch tags from the registry and
    # stitches whatever it finds, so no arch list is passed.
    - name: Create multi-arch manifests
      run: mage package:allManifests
