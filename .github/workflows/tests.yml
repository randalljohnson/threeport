name: Tests

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-24.04
    env:
      GOPATH: /home/runner/go
    steps:
    - name: Checkout
      uses: actions/checkout@v6.0.2

    - name: Set up Go
      uses: actions/setup-go@v6.4.0
      with:
        go-version: '1.24'
        cache: false

    - name: Cache Go build + module cache
      uses: actions/cache@v5.0.5
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: go-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          go-${{ runner.os }}-

    - name: Install mage
      run: go install github.com/magefile/mage@v1.17.2

    - name: Install threeport-sdk
      run: mage install:sdk

    - name: Run threeport-sdk
      run: ${{ env.GOPATH }}/bin/threeport-sdk gen --config sdk-config.yaml

    - name: Verify codegen is idempotent
      run: git diff --exit-code

    - name: Unit tests
      run: go test -count=1 ./pkg/... ./internal/... ./cmd/...

  integration-tests:
    name: Integration Tests
    # image builds and integration tests run on the same runner; both
    # inherit its arch. pin to amd64.
    runs-on: ubuntu-24.04
    env:
      GOPATH: /home/runner/go
    steps:
    - name: Checkout
      uses: actions/checkout@v6.0.2

    - name: Set up Go
      uses: actions/setup-go@v6.4.0
      with:
        go-version: '1.24'
        cache: false

    - name: Cache Go build + module cache
      uses: actions/cache@v5.0.5
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: go-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          go-${{ runner.os }}-

    - name: Install mage
      run: go install github.com/magefile/mage@v1.17.2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4.1.0
      with:
        # share host network so buildx reaches the local registry in the
        # next step.
        driver-opts: network=host

    - name: Create local container registry
      run: mage dev:localRegistryUp

    - name: Assert amd64 runner
      run: |
        if [ "$(uname -m)" != "x86_64" ]; then
          echo "::error::tests.yml requires an amd64 runner; got $(uname -m)"
          exit 1
        fi

    - name: Build and push control plane component images
      env:
        PARALLEL: "1"
        BUILDX_CACHE_FROM: type=gha,scope=test-{component}
        BUILDX_CACHE_TO: type=gha,scope=test-{component},mode=max
      run: mage build:allImagesDev

    - name: Build tptctl
      run: mage build:tptctl

    - name: Create test control plane
      run: mage test:up

    - name: Integration tests
      run: mage test:integration
