name: Test

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

jobs:
  test:
    # must be an amd64 runner: the image-build step uses runtime.GOARCH and
    # the integration suite runs on the same runner, so the host arch is
    # both what we build for and what we test on.
    runs-on: ubuntu-24.04
    env:
      GOPATH: /home/runner/go
    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'

    - name: Install mage
      run: go install github.com/magefile/mage@latest

    - name: Install threeport-sdk
      run: mage install:sdk

    - name: Run threeport-sdk
      run: $(go env GOPATH)/bin/threeport-sdk gen --config sdk-config.yaml

    - name: Ensure no changes were made by threeport-sdk
      run: git diff --exit-code

    - name: Run unit tests
      run: go test -count=1 ./pkg/... ./internal/... ./cmd/...

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      with:
        # share the host network so buildx (docker-container driver) can
        # push to the local registry at localhost:5001 set up in the next
        # step. without this the builder runs in its own network namespace
        # and localhost resolves to the builder container itself.
        driver-opts: network=host

    - name: Create local container registry
      run: mage dev:localRegistryUp

    - name: Assert amd64 runner
      run: |
        if [ "$(uname -m)" != "x86_64" ]; then
          echo "::error::test.yml requires an amd64 runner; got $(uname -m)"
          exit 1
        fi

    - name: Build and push control plane component images
      env:
        PARALLEL: "2"
        BUILDX_CACHE_FROM: type=gha,scope=test-{component}
        BUILDX_CACHE_TO: type=gha,scope=test-{component},mode=max
      run: mage build:allImagesDev

    - name: Build tptctl
      run: mage build:tptctl

    - name: Create test control plane
      run: mage test:up

    - name: Run tests
      run: mage test:integration
